<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medellín 2026 · Nov 11–18 · Luxury Villa in El Poblado</title>
  <meta name="description" content="Our group trip to Medellín, Colombia — Nov 11 to Nov 18, 2026. Luxury 6-bedroom villa in El Poblado with a private pool. Room assignments, amenities, and the Airbnb." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #fbf7f0;
      --ink: #1f2a24;
      --green: #1f6f54;
      --green-dark: #134735;
      --gold: #e8a33d;
      --coral: #e8654a;
      --sky: #2f9bd6;
      --card: #ffffff;
      --line: #e7e0d4;
      --shadow: 0 10px 30px rgba(19, 71, 53, 0.10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--sand);
      line-height: 1.6;
    }
    h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; line-height: 1.1; margin: 0; }
    a { color: var(--green); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

    /* ---------- Hero ---------- */
    header.hero {
      position: relative;
      color: #fff;
      text-align: center;
      padding: 96px 22px 90px;
      background:
        linear-gradient(rgba(19,71,53,0.55), rgba(19,71,53,0.75)),
        radial-gradient(circle at 20% 20%, var(--gold), transparent 45%),
        radial-gradient(circle at 80% 30%, var(--coral), transparent 45%),
        linear-gradient(135deg, var(--green) 0%, var(--sky) 100%);
      overflow: hidden;
    }
    header.hero .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      padding: 7px 16px;
      border-radius: 999px;
      margin-bottom: 22px;
      font-weight: 600;
    }
    header.hero h1 {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    header.hero .dates {
      margin-top: 16px;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 500;
    }
    header.hero .cta-group {
      margin-top: 34px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    header.hero .cta {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      background: #fff;
      color: var(--green-dark);
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    header.hero .cta.secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    header.hero .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }

    /* ---------- Quick facts ---------- */
    .facts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: -48px auto 0;
      position: relative;
      z-index: 5;
    }
    .fact {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px 18px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    .fact .num { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; color: var(--green); }
    .fact .lab { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8079; margin-top: 4px; }

    /* ---------- Calendar Section ---------- */
    .cal-container {
      max-width: 450px;
      margin: 0 auto;
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .cal-month {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      color: var(--green-dark);
      text-align: center;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }
    .cal-day-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 600;
      color: #7a8079;
      padding-bottom: 6px;
    }
    .cal-day {
      font-size: 0.95rem;
      font-weight: 500;
      padding: 10px 0;
      border-radius: 10px;
      color: #bdc2bc; /* empty/non-trip days muted */
      position: relative;
    }
    .cal-day.active-month {
      color: var(--ink);
    }
    /* Staying range style */
    .cal-day.stay {
      background: #eaf3ef;
      color: var(--green-dark);
      border-radius: 0;
      font-weight: 600;
    }
    .cal-day.arrival {
      background: var(--green);
      color: #fff !important;
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      font-weight: 700;
    }
    .cal-day.departure {
      background: var(--coral);
      color: #fff !important;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      font-weight: 700;
    }
    .cal-legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; }
    .legend-dot.arr { background: var(--green); }
    .legend-dot.sty { background: #eaf3ef; border: 1px solid var(--line); }
    .legend-dot.dep { background: var(--coral); }

    /* ---------- Sections ---------- */
    section { padding: 64px 0; }
    .section-head { text-align: center; margin-bottom: 40px; }
    .section-head .kicker {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--coral);
    }
    .section-head h2 { font-size: clamp(1.9rem, 5vw, 2.8rem); margin-top: 8px; color: var(--green-dark); }
    .section-head p { color: #6c726a; max-width: 620px; margin: 12px auto 0; }

    /* ---------- Room cards ---------- */
    .rooms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px; }
    .room {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform .18s ease;
    }
    .room:hover { transform: translateY(-4px); }
    .room.feature { grid-column: 1 / -1; }
    .photo {
      position: relative;
      aspect-ratio: 16 / 9;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
    }
    .room.feature .photo { aspect-ratio: 21 / 9; }
    .photo .ph-note {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.92);
      font-size: 0.85rem;
      text-align: center;
      gap: 6px;
      padding: 12px;
    }
    .photo .ph-note svg { width: 38px; height: 38px; opacity: 0.9; }
    .room .meta { padding: 20px 22px 24px; }
    .room .tag {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      color: var(--green);
      background: #eaf3ef;
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .room h3 { font-size: 1.4rem; color: var(--green-dark); }
    .room .guests { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .guests .chip {
      font-size: 0.85rem;
      background: var(--sand);
      border: 1px solid var(--line);
      padding: 6px 13px;
      border-radius: 999px;
      font-weight: 500;
    }
    .guests .chip.undecided {
      background: #fff0ed;
      border-color: #fcdbd4;
      color: var(--coral);
    }
    .room .bedinfo { margin-top: 12px; color: #6c726a; font-size: 0.92rem; }

    /* ---------- Amenities ---------- */
    .amen-wrap { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .amenities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 26px;
    }
    .amenity {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px dashed var(--line);
      font-weight: 500;
    }
    .amenity svg
